services:
  invoice-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${INVOICE_VERSION:-development}
        VCS_REF: ${INVOICE_VCS_REF:-unknown}
        BUILD_DATE: ${INVOICE_BUILD_DATE:-unknown}
    restart: "no"
    mem_limit: 4g
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./runtime/input:/data/input
      - ./runtime/ocr:/data/ocr
      - ./runtime/work:/data/work
      - ./runtime/manual-review:/data/manual-review
      - ./runtime/error:/data/error
      - ./runtime/archive:/data/archive
      - ./runtime/database:/data/database
      - ./runtime/logs:/data/logs
      - ./docker/application.properties:/config/application.properties:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/app/container-self-check.sh"]
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 30s

  invoice-worker-watch:
    profiles:
      - watch
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${INVOICE_VERSION:-development}
        VCS_REF: ${INVOICE_VCS_REF:-unknown}
        BUILD_DATE: ${INVOICE_BUILD_DATE:-unknown}
    command:
      - watch
      - --profile
      - production
      - --config
      - /config/application.properties
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 4g
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./runtime/input:/data/input
      - ./runtime/ocr:/data/ocr
      - ./runtime/work:/data/work
      - ./runtime/manual-review:/data/manual-review
      - ./runtime/error:/data/error
      - ./runtime/archive:/data/archive
      - ./runtime/database:/data/database
      - ./runtime/logs:/data/logs
      - ./docker/application.properties:/config/application.properties:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/app/container-self-check.sh"]
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 30s

  invoice-worker-api:
    profiles:
      - api
      - ui
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${INVOICE_VERSION:-development}
        VCS_REF: ${INVOICE_VCS_REF:-unknown}
        BUILD_DATE: ${INVOICE_BUILD_DATE:-unknown}
    command:
      - serve
      - --profile
      - production
      - --config
      - /config/application.properties
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 512m
    environment:
      MANUAL_REVIEW_DEFAULT_PAGE_SIZE: ${MANUAL_REVIEW_DEFAULT_PAGE_SIZE:-25}
      MANUAL_REVIEW_MAX_PAGE_SIZE: ${MANUAL_REVIEW_MAX_PAGE_SIZE:-100}
      MANUAL_REVIEW_MAX_OCR_TEXT_LENGTH: ${MANUAL_REVIEW_MAX_OCR_TEXT_LENGTH:-100000}
      MANUAL_REVIEW_DOWNLOAD_ENABLED: ${MANUAL_REVIEW_DOWNLOAD_ENABLED:-true}
    ports:
      - "${INVOICE_API_PORT:-8080}:8080"
    volumes:
      - ./runtime/input:/data/input
      - ./runtime/ocr:/data/ocr
      - ./runtime/work:/data/work
      - ./runtime/manual-review:/data/manual-review
      - ./runtime/error:/data/error
      - ./runtime/archive:/data/archive
      - ./runtime/database:/data/database
      - ./runtime/logs:/data/logs
      - ./docker/application.properties:/config/application.properties:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  invoice-worker-ui:
    profiles:
      - ui
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${INVOICE_VERSION:-development}
        VCS_REF: ${INVOICE_VCS_REF:-unknown}
        BUILD_DATE: ${INVOICE_BUILD_DATE:-unknown}
    command:
      - ui
      - --profile
      - production
      - --config
      - /config/application.properties
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 768m
    depends_on:
      invoice-worker-api:
        condition: service_healthy
    environment:
      INVOICE_UI_MANUAL_REVIEW_API_BASE_URI: ${INVOICE_UI_MANUAL_REVIEW_API_BASE_URI:-http://invoice-worker-api:8080/}
    ports:
      - "${INVOICE_UI_PORT:-8081}:8081"
    volumes:
      - ./runtime/database:/data/database
      - ./runtime/logs:/data/logs
      - ./docker/application.properties:/config/application.properties:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
