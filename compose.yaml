services:
  invoice-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${INVOICE_VERSION:-development}
        VCS_REF: ${INVOICE_VCS_REF:-unknown}
        BUILD_DATE: ${INVOICE_BUILD_DATE:-unknown}
    restart: "no"
    mem_limit: 4g
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INVOICE_AI_PROVIDER: ${INVOICE_AI_PROVIDER:-}
    volumes:
      - ./runtime/input:/data/input
      - ./runtime/ocr:/data/ocr
      - ./runtime/work:/data/work
      - ./runtime/manual-review:/data/manual-review
      - ./runtime/error:/data/error
      - ./runtime/archive:/data/archive
      - ./runtime/database:/data/database
      - ./runtime/logs:/data/logs
      - ./docker/application.properties:/config/application.properties:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/app/container-self-check.sh"]
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 30s

  invoice-worker-watch:
    profiles:
      - watch
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${INVOICE_VERSION:-development}
        VCS_REF: ${INVOICE_VCS_REF:-unknown}
        BUILD_DATE: ${INVOICE_BUILD_DATE:-unknown}
    command:
      - watch
      - --profile
      - production
      - --config
      - /config/application.properties
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 4g
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INVOICE_AI_PROVIDER: ${INVOICE_AI_PROVIDER:-}
    volumes:
      - ./runtime/input:/data/input
      - ./runtime/ocr:/data/ocr
      - ./runtime/work:/data/work
      - ./runtime/manual-review:/data/manual-review
      - ./runtime/error:/data/error
      - ./runtime/archive:/data/archive
      - ./runtime/database:/data/database
      - ./runtime/logs:/data/logs
      - ./docker/application.properties:/config/application.properties:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/app/container-self-check.sh"]
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 30s

  invoice-worker-api:
    profiles:
      - api
      - ui
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${INVOICE_VERSION:-development}
        VCS_REF: ${INVOICE_VCS_REF:-unknown}
        BUILD_DATE: ${INVOICE_BUILD_DATE:-unknown}
    command:
      - serve
      - --profile
      - production
      - --config
      - /config/application.properties
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 512m
    environment:
      MANUAL_REVIEW_DEFAULT_PAGE_SIZE: ${MANUAL_REVIEW_DEFAULT_PAGE_SIZE:-25}
      MANUAL_REVIEW_MAX_PAGE_SIZE: ${MANUAL_REVIEW_MAX_PAGE_SIZE:-100}
      MANUAL_REVIEW_MAX_OCR_TEXT_LENGTH: ${MANUAL_REVIEW_MAX_OCR_TEXT_LENGTH:-100000}
      MANUAL_REVIEW_DOWNLOAD_ENABLED: ${MANUAL_REVIEW_DOWNLOAD_ENABLED:-true}
    ports:
      - "127.0.0.1:${INVOICE_API_PORT:-8080}:8080"
    volumes:
      - ./runtime/input:/data/input
      - ./runtime/ocr:/data/ocr
      - ./runtime/work:/data/work
      - ./runtime/manual-review:/data/manual-review
      - ./runtime/error:/data/error
      - ./runtime/archive:/data/archive
      - ./runtime/database:/data/database
      - ./runtime/logs:/data/logs
      - ./docker/application.properties:/config/application.properties:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  invoice-worker-ui:
    profiles:
      - ui
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${INVOICE_VERSION:-development}
        VCS_REF: ${INVOICE_VCS_REF:-unknown}
        BUILD_DATE: ${INVOICE_BUILD_DATE:-unknown}
    command:
      - ui
      - --profile
      - production
      - --config
      - /config/application.properties
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 768m
    depends_on:
      invoice-worker-api:
        condition: service_healthy
    environment:
      INVOICE_UI_MANUAL_REVIEW_API_BASE_URI: ${INVOICE_UI_MANUAL_REVIEW_API_BASE_URI:-http://invoice-worker-api:8080/}
    ports:
      - "127.0.0.1:${INVOICE_UI_PORT:-8081}:8081"
    volumes:
      - ./runtime/input:/data/input
      - ./runtime/database:/data/database
      - ./runtime/logs:/data/logs
      - ./docker/application.properties:/config/application.properties:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  invoice-oauth2-proxy:
    profiles:
      - public
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    user: "10001:10001"
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/allowed-emails
      OAUTH2_PROXY_REDIRECT_URL: https://invoice.mynet-online.de/oauth2/callback
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: static://200
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: ${OAUTH2_PROXY_TRUSTED_PROXY_IPS:-127.0.0.1/32}
      OAUTH2_PROXY_WHITELIST_DOMAINS: invoice.mynet-online.de
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_COOKIE_NAME: __Host-invoice_oauth2
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 8h
      OAUTH2_PROXY_AUTH_LOGGING: "false"
      OAUTH2_PROXY_REQUEST_LOGGING: "false"
    ports:
      - "127.0.0.1:4180:4180"
    volumes:
      - ${OAUTH2_PROXY_ALLOWED_EMAILS_FILE:-./runtime/secrets/oauth2-allowed-emails}:/etc/oauth2-proxy/allowed-emails:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
